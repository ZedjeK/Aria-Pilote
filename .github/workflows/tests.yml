# Suite de tests à chaque push et pull request, sur Windows avec le Python du projet (3.11).
# Aucun modèle GGUF, moteur llama.cpp ni SearXNG n'est téléchargé : les tests n'en ont pas besoin (faux GGUF, faux
# moteurs, en-têtes dans tests/donnees). Le lanceur C# est compilé avec le csc.exe du .NET Framework, présent sur
# windows-latest.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests
